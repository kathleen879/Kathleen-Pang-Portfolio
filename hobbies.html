<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kathleen's Hobbies</title>
    <link rel="stylesheet" href="css/style.css?v=5">
    <script src="js/main.js?v=5" defer></script>
    <script src="https://kit.fontawesome.com/9365b38aae.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navigation-bar">
        <div class="logo">Kathleen Pang</div>
        <button class="menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">&#9776;</button>
        <ul class="links" id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="education.html">Education</a></li>
            <li><a href="work-experience.html">Work Experience</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="hobbies.html" class="active" aria-current="page">Hobbies</a></li>
        </ul>
    </nav>

    <main>
        <section class="introduction" id="hobbies-introduction">
            <div class="mosaic">
                <!-- Big tile that flips over on hover -->
                <div class="flipcard-container">
                    <div class="flipcard">
                        <div class="front-of-card">
                            <img class="hobby-img-earth" src="images/hobbies/earth.png" alt="Earth">
                        </div>
                        <div class="back-of-card">
                            <img class="hobby-img-earth" src="images/hobbies/just-a-rock.png" alt="Just a rock.">
                        </div>
                    </div>
                </div>

                <div class="travel">
                    <a href="https://kathleen879.github.io/kath.travels/"><img class="hobby-img-small" src="images/hobbies/plane.png" alt="Plane"></a>
                </div>

                <div class="video-editing">
                    <img class="hobby-img-small" src="images/hobbies/video-editing.png" alt="Video Editing">
                </div>

                <div class="music">
                    <img class="hobby-img-small" src="images/hobbies/guitar.png" alt="Guitar">
                </div>

                <div class="running">
                    <img class="hobby-img-medium" src="images/hobbies/running-shoe.png" alt="Running Shoe">
                </div>

                <div class="judo">
                    <img class="hobby-img-medium" src="images/hobbies/judo.png" alt="Judo Gi">
                </div>

                <div class="art">
                    <img class="hobby-img-small" src="images/hobbies/paint.png" alt="Art Palette">
                </div>

                <div class="photography">
                    <img class="hobby-img-small" src="images/hobbies/camera.png" alt="Photography">
                </div>

                <div class="cats">
                    <img class="hobby-img-cats" src="images/hobbies/cats.png" alt="Cats">
                </div>
            </div>
        </section>

        <p class="self-drawn">All illustrations personally drawn on Piskel.</p>
    </main>
</body>
</html>
